<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draft review</title>
  <link rel="stylesheet" href="/preview.css">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@18.1.2/lib/marked.umd.js" integrity="sha384-nCN5FOaVTXXYilftBH/VQuC9ypBYOxrctAZn2x7ggYClXaporWSzM0y+ODhb8MTi" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js" integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous"></script>
  <script defer src="/preview.js"></script>
</head>
<body>
  <aside>
    <div class="brand"><span class="brand-mark">◉</span> Draft review</div>
    <p class="eyebrow">ISSUES &amp; PULL REQUESTS</p>
    <nav id="reports" aria-label="Drafts"></nav>
    <p class="sidebar-note">Select a draft to review.<br>Local preview · unpublished</p>
  </aside>
  <main>
    <div id="connection" role="status">Loading drafts…</div>
    <header>
      <p id="target" class="target"></p>
      <h1 id="title">Draft review</h1>
      <div class="metadata"><span id="kind" class="badge">Draft</span><span id="source"></span></div>
    </header>
    <section class="document" aria-label="Draft document">
      <div class="document-toolbar"><strong>Markdown preview</strong><a id="raw" hidden>View source</a></div>
      <article id="body" class="markdown-body"></article>
    </section>
    <footer>Rendered from the publication draft. Review comments do not publish changes.</footer>
  </main>
</body>
</html>
